<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#FF0000">
    <title>YouTube Music Player - Toca com Tela Bloqueada</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="https://via.placeholder.com/192/FF0000/white?text=YT">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎵 YouTube Music Player</h1>
            <p>🔒 Toca com tela bloqueada • 🔔 Notificações • ⚡ Fundo</p>
        </header>

        <!-- Busca -->
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Buscar música, artista ou link do YouTube...">
            <button id="searchBtn">🔍 Buscar</button>
        </div>

        <!-- Loading -->
        <div id="loading" class="loading hidden">🎧 Carregando músicas...</div>

        <!-- Lista de resultados -->
        <div id="results" class="results"></div>

        <!-- Player Flutuante -->
        <div id="player" class="player hidden">
            <div class="player-info">
                <img id="playerThumb" src="" alt="Capa">
                <div class="player-text">
                    <div id="playerTitle" class="player-title">Nenhuma música</div>
                    <div id="playerChannel" class="player-channel">-</div>
                </div>
            </div>
            <div class="player-controls">
                <button id="playPauseBtn" class="control-btn">⏸️</button>
                <button id="closePlayerBtn" class="control-btn close">✖️</button>
            </div>
        </div>
    </div>

    <!-- Elemento de áudio oculto -->
    <audio id="audioPlayer" style="display: none;"></audio>

    <script src="script.js"></script>
</body>
</html>
