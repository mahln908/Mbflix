<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#FF0000">
    <title>YouTube Music Player - Toca com Tela Bloqueada</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #121212 0%, #1a1a2e 100%);
            color: white;
            min-height: 100vh;
            padding: 20px;
            padding-bottom: 100px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 1.8rem;
            background: linear-gradient(135deg, #FF0000, #FF6B6B);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        header p {
            color: #888;
            font-size: 0.8rem;
            margin-top: 8px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        #searchInput {
            flex: 1;
            padding: 14px 18px;
            border: none;
            border-radius: 50px;
            background: #2a2a3e;
            color: white;
            font-size: 1rem;
            outline: none;
        }

        #searchInput:focus {
            border: 2px solid #FF0000;
            background: #1e1e2e;
        }

        #searchBtn {
            padding: 14px 24px;
            border: none;
            border-radius: 50px;
            background: #FF0000;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        #searchBtn:active {
            transform: scale(0.98);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #FF6B6B;
            font-size: 1.2rem;
        }

        .hidden {
            display: none;
        }

        .results {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .music-item {
            background: #1e1e2e;
            border-radius: 16px;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid #2a2a3e;
        }

        .music-item:active {
            background: #2a2a3e;
            transform: scale(0.99);
            border-color: #FF0000;
        }

        .music-thumb {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            object-fit: cover;
        }

        .music-info {
            flex: 1;
        }

        .music-title {
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .music-channel {
            font-size: 0.75rem;
            color: #FF6B6B;
        }

        /* Player Flutuante */
        .player {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #1a1a2e;
            backdrop-filter: blur(20px);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid #FF0000;
            box-shadow: 0 -5px 30px rgba(0,0,0,0.5);
            z-index: 1000;
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        #playerThumb {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            object-fit: cover;
        }

        .player-text {
            flex: 1;
        }

        .player-title {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 3px;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .player-channel {
            font-size: 0.7rem;
            color: #FF6B6B;
        }

        .player-controls {
            display: flex;
            gap: 15px;
        }

        .control-btn {
            background: none;
            border: none;
            font-size: 1.8rem;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: all 0.2s;
        }

        .control-btn:active {
            background: rgba(255,0,0,0.2);
            transform: scale(0.95);
        }

        .close {
            font-size: 1.2rem;
            color: #888;
        }

        .toast {
            position: fixed;
            bottom: 120px;
            left: 20px;
            right: 20px;
            background: #333;
            color: white;
            text-align: center;
            padding: 12px;
            border-radius: 50px;
            z-index: 1001;
            font-size: 0.9rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            animation: fadeInOut 2s ease forwards;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateY(20px); }
            15% { opacity: 1; transform: translateY(0); }
            85% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(20px); }
        }

        /* Player YouTube escondido */
        .youtube-player {
            position: fixed;
            bottom: -100%;
            left: 0;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }

        iframe {
            width: 1px;
            height: 1px;
            opacity: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎵 YouTube Music Player</h1>
            <p>🔒 Toca com tela bloqueada • 🔔 Notificações • ⚡ Fundo</p>
        </header>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Buscar música, artista ou link...">
            <button id="searchBtn">🔍 Buscar</button>
        </div>

        <div id="loading" class="loading hidden">🎧 Carregando músicas...</div>
        <div id="results" class="results"></div>

        <!-- Player flutuante -->
        <div id="player" class="player hidden">
            <div class="player-info">
                <img id="playerThumb" src="" alt="Capa">
                <div class="player-text">
                    <div id="playerTitle" class="player-title">Nenhuma música</div>
                    <div id="playerChannel" class="player-channel">-</div>
                </div>
            </div>
            <div class="player-controls">
                <button id="playPauseBtn" class="control-btn">▶️</button>
                <button id="closePlayerBtn" class="control-btn close">✖️</button>
            </div>
        </div>
    </div>

    <!-- Player do YouTube (escondido mas necessário para background) -->
    <div id="youtubePlayer" class="youtube-player"></div>

    <script>
        // ============================================
        // CONFIGURAÇÃO
        // ============================================
        
        const API_KEY = 'AIzaSyAivynv6ZIBMwcdSx6W2VSBF13lADY5FWs';
        let currentVideoId = null;
        let currentTitle = '';
        let currentChannel = '';
        let currentThumb = '';
        let player = null;
        let isPlaying = false;
        
        // ============================================
        // INICIALIZAR PLAYER DO YOUTUBE
        // ============================================
        
        function loadYouTubeAPI() {
            const tag = document.createElement('script');
            tag.src = 'https://www.youtube.com/iframe_api';
            const firstScriptTag = document.getElementsByTagName('script')[0];
            firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
        }
        
        window.onYouTubeIframeAPIReady = function() {
            player = new YT.Player('youtubePlayer', {
                height: '0',
                width: '0',
                videoId: '',
                playerVars: {
                    'playsinline': 1,
                    'autoplay': 0,
                    'controls': 0,
                    'disablekb': 1,
                    'fs': 0,
                    'iv_load_policy': 3,
                    'modestbranding': 1,
                    'rel': 0,
                    'showinfo': 0
                },
                events: {
                    'onStateChange': onPlayerStateChange,
                    'onReady': onPlayerReady
                }
            });
        };
        
        function onPlayerReady(event) {
            console.log('✅ Player YouTube pronto');
        }
        
        function onPlayerStateChange(event) {
            // Atualizar botão play/pause
            if (event.data === YT.PlayerState.PLAYING) {
                isPlaying = true;
                document.getElementById('playPauseBtn').innerHTML = '⏸️';
                updateMediaSession('playing');
                showToast('🎶 Tocando: ' + currentTitle.substring(0, 40));
            } else if (event.data === YT.PlayerState.PAUSED) {
                isPlaying = false;
                document.getElementById('playPauseBtn').innerHTML = '▶️';
                updateMediaSession('paused');
            } else if (event.data === YT.PlayerState.ENDED) {
                isPlaying = false;
                document.getElementById('playPauseBtn').innerHTML = '▶️';
                updateMediaSession('paused');
            }
        }
        
        // ============================================
        // MEDIA SESSION - TELA BLOQUEADA
        // ============================================
        
        function updateMediaSession(state) {
            if ('mediaSession' in navigator) {
                if (state === 'playing') {
                    navigator.mediaSession.playbackState = 'playing';
                } else {
                    navigator.mediaSession.playbackState = 'paused';
                }
            }
        }
        
        function setupMediaSession(title, artist, artwork) {
            if (!('mediaSession' in navigator)) return;
            
            navigator.mediaSession.metadata = new MediaMetadata({
                title: title.substring(0, 100),
                artist: artist,
                album: 'YouTube Music Player',
                artwork: [
                    { src: artwork, sizes: '96x96', type: 'image/jpeg' },
                    { src: artwork, sizes: '128x128', type: 'image/jpeg' },
                    { src: artwork, sizes: '192x192', type: 'image/jpeg' },
                    { src: artwork, sizes: '512x512', type: 'image/jpeg' }
                ]
            });
            
            navigator.mediaSession.setActionHandler('play', () => playMusicCurrent());
            navigator.mediaSession.setActionHandler('pause', () => pauseMusic());
            navigator.mediaSession.setActionHandler('previoustrack', () => {});
            navigator.mediaSession.setActionHandler('nexttrack', () => {});
        }
        
        function playMusicCurrent() {
            if (player && currentVideoId) {
                player.playVideo();
            }
        }
        
        function pauseMusic() {
            if (player) {
                player.pauseVideo();
            }
        }
        
        // ============================================
        // REPRODUZIR MÚSICA
        // ============================================
        
        function playMusic(videoId, title, channel, thumbnail) {
            if (!videoId) {
                showToast('❌ ID do vídeo inválido');
                return;
            }
            
            currentVideoId = videoId;
            currentTitle = title;
            currentChannel = channel;
            currentThumb = thumbnail;
            
            // Mostrar player
            document.getElementById('player').classList.remove('hidden');
            document.getElementById('playerTitle').innerText = title.substring(0, 60);
            document.getElementById('playerChannel').innerText = channel;
            document.getElementById('playerThumb').src = thumbnail;
            
            // Configurar notificação da tela bloqueada
            setupMediaSession(title, channel, thumbnail);
            
            // Carregar no player do YouTube
            if (player && player.loadVideoById) {
                player.loadVideoById(videoId);
                player.playVideo();
            } else {
                // Aguardar player carregar
                const checkPlayer = setInterval(() => {
                    if (player && player.loadVideoById) {
                        player.loadVideoById(videoId);
                        player.playVideo();
                        clearInterval(checkPlayer);
                    }
                }, 100);
            }
        }
        
        // ============================================
        // PLAY/PAUSE
        // ============================================
        
        function togglePlayPause() {
            if (!currentVideoId) {
                showToast('🎵 Selecione uma música primeiro');
                return;
            }
            
            if (player) {
                if (isPlaying) {
                    player.pauseVideo();
                } else {
                    player.playVideo();
                }
            }
        }
        
        // ============================================
        // BUSCAR MÚSICAS
        // ============================================
        
        async function searchYouTube(query) {
            if (!query.trim()) {
                showToast('🔍 Digite o nome de uma música');
                return;
            }
            
            const loading = document.getElementById('loading');
            const resultsDiv = document.getElementById('results');
            
            loading.classList.remove('hidden');
            resultsDiv.innerHTML = '';
            
            // Verificar se é link do YouTube
            const youtubeRegex = /(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/;
            const match = query.match(youtubeRegex);
            if (match) {
                const videoId = match[1];
                loading.classList.add('hidden');
                fetchVideoInfo(videoId);
                return;
            }
            
            // Buscar na API do YouTube
            const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=20&q=${encodeURIComponent(query)}&type=video&key=${API_KEY}`;
            
            try {
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error.message);
                }
                
                loading.classList.add('hidden');
                
                if (!data.items || data.items.length === 0) {
                    resultsDiv.innerHTML = '<div class="loading">😢 Nenhum resultado encontrado</div>';
                    return;
                }
                
                data.items.forEach(item => {
                    const videoId = item.id.videoId;
                    const title = item.snippet.title;
                    const channel = item.snippet.channelTitle;
                    const thumbnail = item.snippet.thumbnails.medium.url;
                    
                    const musicDiv = document.createElement('div');
                    musicDiv.className = 'music-item';
                    musicDiv.onclick = () => playMusic(videoId, title, channel, thumbnail);
                    musicDiv.innerHTML = `
                        <img class="music-thumb" src="${thumbnail}" onerror="this.src='https://placehold.co/60x60/FF0000/white?text=YT'">
                        <div class="music-info">
                            <div class="music-title">${escapeHtml(title.substring(0, 80))}</div>
                            <div class="music-channel">${escapeHtml(channel)}</div>
                        </div>
                        <button class="control-btn" style="font-size:1.5rem">▶️</button>
                    `;
                    resultsDiv.appendChild(musicDiv);
                });
                
            } catch (error) {
                loading.classList.add('hidden');
                resultsDiv.innerHTML = `<div class="loading">❌ Erro: ${error.message}</div>`;
            }
        }
        
        async function fetchVideoInfo(videoId) {
            const url = `https://www.googleapis.com/youtube/v3/videos?part=snippet&id=${videoId}&key=${API_KEY}`;
            showToast('📹 Carregando...');
            
            try {
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.items && data.items[0]) {
                    const video = data.items[0];
                    const title = video.snippet.title;
                    const channel = video.snippet.channelTitle;
                    const thumbnail = video.snippet.thumbnails.medium.url;
                    playMusic(videoId, title, channel, thumbnail);
                } else {
                    showToast('❌ Vídeo não encontrado');
                }
            } catch (error) {
                showToast('❌ Erro ao carregar');
            }
        }
        
        // ============================================
        // UTILITÁRIOS
        // ============================================
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function showToast(message) {
            const oldToast = document.querySelector('.toast');
            if (oldToast) oldToast.remove();
            
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                if (toast && toast.remove) toast.remove();
            }, 2000);
        }
        
        // ============================================
        // CONFIGURAR BACKGROUND E PWA
        // ============================================
        
        // Registrar Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => {
                console.log('Service Worker:', err);
            });
        }
        
        // Eventos
        document.getElementById('searchBtn').onclick = () => searchYouTube(document.getElementById('searchInput').value);
        document.getElementById('searchInput').onkeypress = (e) => {
            if (e.key === 'Enter') searchYouTube(e.target.value);
        };
        document.getElementById('playPauseBtn').onclick = togglePlayPause;
        document.getElementById('closePlayerBtn').onclick = () => {
            if (player) player.stopVideo();
            currentVideoId = null;
            isPlaying = false;
            document.getElementById('player').classList.add('hidden');
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = null;
            }
        };
        
        // Carregar API do YouTube
        loadYouTubeAPI();
        
        console.log('✅ App pronto!');
    </script>
</body>
    </html>
